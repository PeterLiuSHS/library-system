server:
  port: 8082

spring:
  application:
    name: loan-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/loan_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

services:
  user:
    base-url: ${USER_SERVICE_BASE_URL:http://localhost:8081}
  book:
    base-url: ${BOOK_SERVICE_BASE_URL:http://localhost:8080}