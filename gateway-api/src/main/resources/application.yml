server:
  port: 9000

spring:
  application:
    name: gateway-api

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: loan-api-user-routes
              uri: ${LOAN_API_URL:http://localhost:8082}
              predicates:
                - Path=/users/*/loans/**
                # *  matches a single path segment    /users/1/loans CORRECT  /users/1/23/loans not Allowed
                # ** matches zero or more path segments  /users/1/loans correct  /users/1/loans/1/return correct

            - id: loan-api-book-availability
              uri: ${LOAN_API_URL:http://localhost:8082}
              predicates:
                - Path=/books/*/availability

            - id: user-api
              uri: ${USER_API_URL:http://localhost:8081}
              predicates:
                - Path=/users/**

            - id: book-api
              uri: ${BOOK_API_URL:http://localhost:8080}
              predicates:
                - Path=/books/**

